---
services:
  app:
    image: serversideup/php:${PHP_VERSION:-8.4}-fpm-nginx
    container_name: phagrancy-app
    ports:
      - "${TEST_PORT:-8080}:8080"
    volumes:
      - "${PWD}/../../:/var/www/html"
      - "${PWD}/../../web:/var/www/html/public"
    environment:
      # serversideup/php
      PHP_OPCACHE_ENABLE: 0
      # PHAGRANCY
      PHAGRANCY_API_TOKEN: "token"
      PHAGRANCY_STORAGE_PATH: "/tmp"
