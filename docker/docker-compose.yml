services:
  phagrancy:
    image: ghcr.io/dlundgren/phagrancy:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    environment:
      SSL_MODE: "full"
      NGINX_CLIENT_MAX_BODY_SIZE: "10G"
      PHAGRANCY_API_TOKEN: "change-me-before-running"
      PHAGRANCY_STORAGE_PATH: "/var/www/html/storage/boxes"
    volumes:
      - phagrancy_storage:/var/www/html/storage/boxes
      # uncomment this if you want a .env file instead of the environment
      #- ./.env:/var/www/html/.env:ro
    restart: unless-stopped

volumes:
  phagrancy_storage:
