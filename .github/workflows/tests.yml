name: Tests

on: [push, pull_request]

jobs:
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    services:
      phagrancy-app:
        image: serversideup/php:${{ matrix.php }}-fpm-nginx
        options: --name phagrancy-app
        ports:
          - "8080:8080"
        volumes:
          - "${{ github.workspace }}:/var/www/html"
          - "${{ github.workspace }}/web:/var/www/html/public"
        env:
          # PHAGRANCY
          PHAGRANCY_API_TOKEN: "token"
          PHAGRANCY_STORAGE_PATH: "/tmp"
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        experimental: [false]
        include:
          - php: 8.2
            analysis: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restart app container
        uses: docker://docker
        with:
          args: docker restart phagrancy-app

      - name: Packer Setup
        uses: hashicorp/setup-packer@v3
        with:
          version: "latest"

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install dependencies with Composer
        uses: ramsey/composer-install@v4

      - name: Tests
        run: |
          packer plugins install github.com/hashicorp/vagrant
          composer ci-test

      - name: Generate Code Coverage
        if: matrix.analysis
        run: composer test-coverage

      - name: Code quality
        uses: qltysh/qlty-action/coverage@v2
        if: matrix.analysis
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: build/logs/clover.xml
